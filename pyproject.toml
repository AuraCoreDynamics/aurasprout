[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurasprout"
version = "0.1.1"
description = "User-space zero-privilege AuraGrid cell coordination, application catalog, installer, and supervision layer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "auraseed>=1.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
grid = [
    "auragrid>=4.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
aurasprout = "aurasprout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurasprout*"]

[tool.setuptools.package-data]
aurasprout = ["ui/static/*", "openapi.json", "openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/stubs"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

